spring.application.name=protube-back
server.port=8080
spring.thymeleaf.prefix=classpath:/static/

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

spring.profiles.active=@spring.profiles.active@

# Override ENV_PROTUBE_STORE_DIR when using an external store. By default, local
# development uses the repository-level video-store directory.
pro_tube.store.dir=${ENV_PROTUBE_STORE_DIR:${user.dir}/../video-store/}

spring.security.oauth2.client.registration.google.client-id=${ENV_PROTUBE_GOOGLE_CLIENT_ID:local-disabled-client}
spring.security.oauth2.client.registration.google.client-secret=${ENV_PROTUBE_GOOGLE_CLIENT_SECRET:local-disabled-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub
spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com
pro_tube.frontend.url=${ENV_PROTUBE_FRONTEND_URL:http://localhost:5173}

#---
spring.config.activate.on-profile=dev
pro_tube.load_initial_data=true
spring.datasource.url=jdbc:postgresql://${ENV_PROTUBE_DB_HOST:localhost}:5432/${ENV_PROTUBE_DB:protube}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${ENV_PROTUBE_DB_USER:postgres}
spring.datasource.password=${ENV_PROTUBE_DB_PWD:secret}
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing ProTube schema

#---
spring.config.activate.on-profile=prod
pro_tube.load_initial_data=false
# For a simpler approach you can reuse the h2 from dev (adjust other config properly)
# spring.datasource.url=jdbc:h2:mem:mydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.url=jdbc:postgresql://${ENV_PROTUBE_DB_HOST}:5432/${ENV_PROTUBE_DB}
spring.datasource.username=${ENV_PROTUBE_DB_USER}
spring.datasource.password=${ENV_PROTUBE_DB_PWD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.password=${ENV_PROTUBE_DB_PWD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing ProTube schema

spring.mvc.static-path-pattern=/media/**
logging.level.org.springframework.web=DEBUG
