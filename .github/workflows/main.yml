
name: Pull Request CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN_CONFIGURED: ${{ secrets.SONAR_TOKEN != '' }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: protube
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d protube"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # Checkout
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # Frontend
      - name: Set up Node.js for frontend
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm run test -- --coverage --watchAll=false --ci

      # Backend
      - name: Set up Java for backend
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Install Maven Wrapper
        working-directory: backend
        run: mvn -N io.takari:maven:wrapper

      - name: Build and test backend with coverage
        working-directory: backend
        env:
          ENV_PROTUBE_DB_HOST: localhost
          ENV_PROTUBE_DB: protube
          ENV_PROTUBE_DB_USER: postgres
          ENV_PROTUBE_DB_PWD: secret
        run: |
          ./mvnw clean verify -Pcoverage

      # Frontend lint
      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      # SonarQube Cloud Analysis
      - name: SonarQube Cloud Scan
        if: ${{ env.SONAR_TOKEN_CONFIGURED == 'true' }}
        uses: SonarSource/sonarqube-scan-action@8c71dc039c2dd71d3821e89a2b58ecc7fee6ced9 # v5.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      # Upload Frontend Coverage
      - name: Upload Frontend Coverage Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          if-no-files-found: error

      # Upload Backend Coverage
      - name: Upload Backend Coverage Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage-report
          path: backend/target/site/jacoco/
          if-no-files-found: error

  # End-to-End Tests
  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Start the complete Docker Compose stack
        env:
          ENV_PROTUBE_GOOGLE_CLIENT_ID: ${{ secrets.ENV_PROTUBE_GOOGLE_CLIENT_ID }}
          ENV_PROTUBE_GOOGLE_CLIENT_SECRET: ${{ secrets.ENV_PROTUBE_GOOGLE_CLIENT_SECRET }}
        run: docker compose up --build -d

      - name: Wait for the frontend
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1/ > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci --ignore-scripts

      - name: Install Playwright browser
        working-directory: e2e
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        run: npm test

      - name: Stop the complete Docker Compose stack
        if: always()
        run: docker compose down -v
