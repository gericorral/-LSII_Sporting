name: Pull Request CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: protube
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d protube"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm run test -- --coverage --watchAll=false --ci

      - name: Set up Java for backend
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Install Maven Wrapper
        working-directory: backend
        run: mvn -N io.takari:maven:wrapper

      - name: Build and test backend with coverage
        working-directory: backend
        env:
          ENV_PROTUBE_DB_HOST: localhost
          ENV_PROTUBE_DB: protube
          ENV_PROTUBE_DB_USER: postgres
          ENV_PROTUBE_DB_PWD: secret
        run: |
          ./mvnw clean verify -Pcoverage

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      # Upload Frontend Coverage
      - name: Upload Frontend Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          if-no-files-found: error

      # Upload Backend Coverage
      - name: Upload Backend Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/target/site/jacoco/
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start the complete Docker Compose stack
        run: docker compose up --build -d

      - name: Wait for the frontend
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1/ > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        run: npm test

      - name: Stop the complete Docker Compose stack
        if: always()
        run: docker compose down -v
